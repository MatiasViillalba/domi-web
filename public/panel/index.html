<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Sistema de conexión de DOMI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: barra lateral fija de 248 px + lienzo de trabajo; en teléfono, barra superior y barra inferior.
   Identidad de la web domi-web: grafito, una sola luz de color (la del NODO) y datos en monoespaciada. */
:root {
  color-scheme: dark;
  --bg: #08090b; --side: #0c0d10; --s1: #111215; --s2: #16171b; --s3: #1d1e23; --grafito: #1d1e22; --inv: #f2f3f5;
  --l1: rgba(255,255,255,.07); --l2: rgba(255,255,255,.11); --l3: rgba(255,255,255,.2);
  --fg: #f2f3f5; --fg2: #9a9ea7; --fg3: #80848e; --ink: #08090b;
  --ok: #34e07a; --think: #3d7bff; --resp: #5a6bff; --voz: #2fd3ff; --mute: #ff453a; --idle: #c9cdd6; --warn: #f5b83d; --err: #ff6b5e;
  --t-ok: rgba(52,224,122,.12); --t-ok2: rgba(52,224,122,.5); --t-mute: rgba(255,69,58,.13); --t-mute2: rgba(255,69,58,.45);
  --t-warn: rgba(245,184,61,.12); --t-warn2: rgba(245,184,61,.45); --t-err: rgba(255,107,94,.12); --t-err2: rgba(255,107,94,.45);
  --t-think: rgba(61,123,255,.14); --t-resp: rgba(90,107,255,.16); --t-voz: rgba(47,211,255,.12); --t-idle: rgba(201,205,214,.1);
  --f-ui: "Schibsted Grotesk", "Helvetica Neue", Arial, sans-serif;
  --f-data: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --side-w: 248px; --tab-h: 64px;
}
* { box-sizing: border-box; }
html, body { min-height: 100%; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 14px/1.45 var(--f-ui); -webkit-font-smoothing: antialiased; }
a { color: inherit; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--ok); outline-offset: 2px; }
.ic { width: 20px; height: 20px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
.ic.s16 { width: 16px; height: 16px; } .ic.s14 { width: 14px; height: 14px; } .ic.s24 { width: 24px; height: 24px; }
.mono { font-family: var(--f-data); font-variant-numeric: tabular-nums; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
h1, h2, h3 { margin: 0; text-wrap: balance; font-weight: 600; }
h1 { font-size: 32px; line-height: 38px; letter-spacing: -.02em; }
h1.big { font-size: 44px; line-height: 48px; letter-spacing: -.025em; }
h2 { font-size: 22px; line-height: 28px; letter-spacing: -.012em; }
h3 { font-size: 17px; line-height: 24px; letter-spacing: -.006em; }
p { margin: 0; }
.lead { color: var(--fg2); font-size: 16px; line-height: 24px; max-width: 64ch; }
.muted { color: var(--fg2); } .faint { color: var(--fg3); }
.small { font-size: 13px; line-height: 18px; } .cap { font-size: 12px; line-height: 16px; }
.eyebrow { display: inline-flex; align-items: center; gap: 8px; font: 500 11px/14px var(--f-data); letter-spacing: .14em; text-transform: uppercase; color: var(--fg2); margin: 0; }
.dot { width: 6px; height: 6px; border-radius: 50%; background: var(--c, var(--ok)); box-shadow: 0 0 10px var(--c, var(--ok)); flex: none; }

/* ---------- estructura */
.app { display: grid; grid-template-columns: var(--side-w) minmax(0, 1fr); min-height: 100vh; }
.side { position: sticky; top: 0; height: 100vh; display: flex; flex-direction: column; gap: 0; padding: 24px 16px 18px; background: var(--side); border-right: 1px solid var(--l1); overflow-y: auto; }
.brand { display: inline-flex; align-items: center; gap: 10px; text-decoration: none; padding: 4px 8px; border-radius: 8px; width: max-content; }
.brand svg { width: 22px; height: 22px; } .brand b { font-weight: 600; letter-spacing: .32em; font-size: 14px; }
.home-card { display: flex; align-items: center; gap: 12px; margin-top: 24px; padding: 10px 12px 10px 10px; border-radius: 12px; background: var(--s1); border: 1px solid var(--l1); }
.home-card .home-ic { display: grid; place-items: center; width: 32px; height: 32px; border-radius: 9px; background: var(--t-ok); color: var(--ok); }
.home-card b, .user b { display: block; font-weight: 500; } .home-card small, .user small { display: block; color: var(--fg3); font-size: 12px; }
.side-eb { margin: 24px 12px 8px; color: var(--fg3); }
.nav { display: flex; flex-direction: column; gap: 2px; }
.nav-i { display: flex; align-items: center; gap: 12px; height: 40px; padding: 0 12px; border-radius: 10px; text-decoration: none; color: var(--fg2); font-weight: 500; border: 1px solid transparent; transition: background .15s, color .15s; }
.nav-i .ic { color: var(--fg3); transition: color .15s; }
.nav-i:hover { background: var(--l1); color: var(--fg); } .nav-i:hover .ic { color: var(--fg); }
.nav-i.on { background: var(--s2); border-color: var(--l1); color: var(--fg); } .nav-i.on .ic { color: var(--fg); }
.nav-i span { flex: 1; } .nav-i .cnt { flex: none; font: 12px var(--f-data); color: var(--fg3); }
.nav-i.on::after { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--ok); box-shadow: 0 0 10px var(--ok); }
.side-fill { flex: 1; min-height: 16px; }
.core-mini { display: flex; flex-direction: column; gap: 10px; padding: 14px; border-radius: 14px; background: var(--s1); border: 1px solid var(--l1); text-decoration: none; transition: border-color .15s; }
.core-mini:hover { border-color: var(--l3); }
.core-mini .row { display: flex; align-items: center; gap: 8px; } .core-mini .row b { font-weight: 500; flex: 1; }
.bar { height: 4px; border-radius: 2px; background: var(--l2); overflow: hidden; } .bar i { display: block; height: 100%; background: var(--ok); border-radius: 2px; }
.user { display: flex; align-items: center; gap: 12px; padding: 12px 8px 0; }
.avatar { display: grid; place-items: center; width: 32px; height: 32px; border-radius: 50%; background: var(--s3); font-weight: 500; flex: none; }

.main { min-width: 0; padding-block: 40px 72px; padding-left: max(48px, env(safe-area-inset-left, 0px)); padding-right: max(48px, env(safe-area-inset-right, 0px)); position: relative; outline: none; }
.main::before { content: ""; position: absolute; inset: 0 0 auto 0; height: 420px; background: radial-gradient(60% 70% at 70% 0%, rgba(52,224,122,.07), transparent 70%); pointer-events: none; }
.page { position: relative; display: flex; flex-direction: column; gap: 32px; max-width: 1096px; margin: 0 auto; }
.topbar, .tabbar { display: none; }

/* ---------- piezas comunes */
.phead { display: flex; align-items: flex-end; gap: 24px; flex-wrap: wrap; }
.phead-t { flex: 1 1 520px; min-width: 0; display: flex; flex-direction: column; gap: 12px; }
.phead-a { display: flex; gap: 12px; flex-wrap: wrap; }
.card { background: var(--s1); border: 1px solid var(--l1); border-radius: 16px; box-shadow: inset 0 1px 0 rgba(255,255,255,.045); padding: 24px; min-width: 0; }
.card.tight { padding: 20px; }
.card-h { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.card-h .grow { flex: 1; }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 24px; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 40px; padding: 0 18px; border-radius: 999px; border: 1px solid transparent; font-weight: 600; font-size: 14px; white-space: nowrap; transition: background .15s, border-color .15s, color .15s, box-shadow .15s; text-decoration: none; }
.btn .ic { width: 18px; height: 18px; }
.btn.primary { background: var(--inv); color: var(--ink); } .btn.primary:hover { background: #fff; box-shadow: 0 0 18px rgba(255,255,255,.16); }
.btn.secondary { border-color: var(--l3); background: transparent; } .btn.secondary:hover { background: var(--s3); }
.btn.ghost { background: transparent; color: var(--fg2); padding: 0 12px; } .btn.ghost:hover { background: var(--l1); color: var(--fg); }
.btn.danger { border-color: var(--t-err2); color: var(--err); background: transparent; } .btn.danger:hover { background: var(--t-err); border-color: var(--err); }
.btn.sm { height: 32px; padding: 0 12px; font-size: 13px; }
.btn:disabled { background: var(--s3); color: var(--fg3); border-color: transparent; cursor: default; box-shadow: none; }
.btn.wide { width: 100%; }
.icon-btn { display: grid; place-items: center; width: 36px; height: 36px; border-radius: 50%; border: 1px solid var(--l2); background: transparent; color: var(--fg2); flex: none; }
.icon-btn:hover { background: var(--s3); color: var(--fg); }
.badge { display: inline-flex; align-items: center; gap: 6px; height: 24px; padding: 0 10px 0 8px; border-radius: 999px; font-size: 12px; font-weight: 500; white-space: nowrap; background: var(--bt, var(--l1)); color: var(--bc, var(--fg2)); }
.badge i { width: 6px; height: 6px; border-radius: 50%; background: var(--bc, var(--fg2)); box-shadow: 0 0 8px var(--bc, transparent); }
.b-ok { --bt: var(--t-ok); --bc: var(--ok); } .b-think { --bt: var(--t-think); --bc: var(--think); } .b-resp { --bt: var(--t-resp); --bc: var(--resp); }
.b-voz { --bt: var(--t-voz); --bc: var(--voz); } .b-mute { --bt: var(--t-mute); --bc: var(--mute); } .b-warn { --bt: var(--t-warn); --bc: var(--warn); }
.b-idle { --bt: var(--t-idle); --bc: var(--fg2); } .b-err { --bt: var(--t-err); --bc: var(--err); } .b-neutral { --bt: var(--l1); --bc: var(--fg2); }
.b-neutral i { box-shadow: none; }
.switch { position: relative; width: 40px; height: 24px; border-radius: 999px; border: 1px solid var(--l2); background: var(--s3); flex: none; padding: 0; transition: background .18s, border-color .18s; }
.switch::after { content: ""; position: absolute; top: 2px; left: 2px; width: 18px; height: 18px; border-radius: 50%; background: var(--fg2); transition: transform .18s ease, background .18s; }
.switch[aria-checked="true"] { background: var(--ok); border-color: var(--ok); } .switch[aria-checked="true"]::after { transform: translateX(16px); background: var(--ink); }
.switch:disabled { opacity: .45; cursor: default; }
.chip { display: inline-flex; align-items: center; gap: 6px; height: 34px; padding: 0 14px; border-radius: 999px; border: 1px solid var(--l2); background: transparent; color: var(--fg2); font-weight: 500; }
.chip:hover { border-color: var(--l3); color: var(--fg); }
.chip[aria-pressed="true"] { background: var(--t-ok); border-color: var(--t-ok2); color: var(--fg); }
.chip:disabled { opacity: .45; cursor: default; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.seg { display: inline-flex; padding: 3px; gap: 2px; border-radius: 999px; background: var(--s2); border: 1px solid var(--l1); }
.seg button { border: 0; background: transparent; color: var(--fg2); height: 30px; padding: 0 14px; border-radius: 999px; font-weight: 500; font-size: 13px; }
.seg button[aria-pressed="true"] { background: var(--inv); color: var(--ink); }
.field { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.field label, .flabel { font-size: 13px; line-height: 18px; font-weight: 500; color: var(--fg2); }
.input { width: 100%; height: 44px; padding: 0 14px; border-radius: 12px; background: var(--s2); border: 1px solid var(--l2); color: var(--fg); transition: border-color .15s, box-shadow .15s; }
textarea.input { height: 120px; padding: 12px 14px; resize: vertical; line-height: 20px; }
.input::placeholder { color: var(--fg3); }
.input:hover { border-color: var(--l3); }
.input:focus { outline: none; border-color: var(--ok); box-shadow: 0 0 0 4px rgba(52,224,122,.18); }
.input.bad { border-color: var(--err); } .input.bad:focus { box-shadow: 0 0 0 4px rgba(255,107,94,.18); }
.help { font-size: 12px; line-height: 16px; color: var(--fg3); display: flex; gap: 6px; align-items: flex-start; }
.help.bad { color: var(--err); }
input[type="range"] { width: 100%; accent-color: var(--inv); height: 20px; }
.kv { display: flex; align-items: center; gap: 10px; padding: 9px 0; }
.kv .k { flex: 1; color: var(--fg2); font-size: 13px; } .kv .v { font: 13px/18px var(--f-data); text-align: right; }
.kv .ic { color: var(--fg3); }
.divider { height: 1px; background: var(--l1); border: 0; margin: 0; }
.list > * + * { border-top: 1px solid var(--l1); }
.tile { display: grid; place-items: center; width: 36px; height: 36px; border-radius: 10px; background: var(--s2); border: 1px solid var(--l1); flex: none; }
.empty { display: flex; flex-direction: column; align-items: center; gap: 10px; text-align: center; padding: 28px 24px; border: 1px dashed var(--l3); border-radius: 14px; }
.spin { width: 20px; height: 20px; border-radius: 50%; border: 2px solid var(--l2); border-top-color: var(--ok); animation: spin .8s linear infinite; flex: none; }
.spin.lg { width: 36px; height: 36px; border-width: 3px; }
@keyframes spin { to { transform: rotate(360deg); } }
.skel { background: linear-gradient(90deg, var(--s2), var(--s3), var(--s2)); background-size: 200% 100%; animation: shimmer 1.4s ease-in-out infinite; border-radius: 8px; }
@keyframes shimmer { from { background-position: 100% 0; } to { background-position: -100% 0; } }
.note { display: flex; gap: 10px; align-items: flex-start; padding: 12px 14px; border-radius: 12px; font-size: 13px; line-height: 18px; }
.note.info { background: var(--t-think); color: var(--fg); } .note.info .ic { color: var(--think); }
.note.warn { background: var(--t-warn); border: 1px solid var(--t-warn2); } .note.warn .ic { color: var(--warn); }
.note.err { background: var(--t-err); border: 1px solid var(--t-err2); color: var(--err); }
.note.ok { background: var(--t-ok); border: 1px solid var(--t-ok2); } .note.ok .ic { color: var(--ok); }
.stage { position: relative; display: grid; place-items: center; background: var(--bg); border: 1px solid var(--l1); border-radius: 12px; overflow: hidden; }
.stage { height: 100px; } .stage.big { height: 176px; }
.stage canvas { display: block; width: 100%; height: 100%; }

/* ---------- Inicio */
.row1 { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 24px; }
.kpis { display: flex; flex-direction: column; gap: 12px; }
.kpi { display: flex; flex-direction: column; justify-content: space-between; gap: 10px; flex: 1; }
.kpi .lbl { display: flex; align-items: center; gap: 8px; } .kpi .lbl .ic { color: var(--fg3); }
.kpi .val { display: flex; align-items: flex-end; gap: 8px; }
.kpi .num { font-size: 40px; line-height: 44px; font-weight: 600; letter-spacing: -.025em; }
.kpi .val .grow { flex: 1; }
.routes { display: flex; gap: 2px; width: 128px; height: 8px; }
.routes i { display: block; border-radius: 3px; }
.bullet { position: relative; width: 140px; height: 30px; }
.bullet .tr { position: absolute; left: 0; right: 0; top: 18px; height: 4px; border-radius: 2px; background: var(--l2); }
.bullet .bd { position: absolute; top: 18px; height: 4px; background: var(--t-ok2); }
.bullet .mk { position: absolute; top: 13px; width: 3px; height: 14px; border-radius: 1px; background: var(--ok); transform: translateX(-1px); }
.bullet .goal { position: absolute; top: 12px; width: 1.5px; height: 16px; background: var(--fg2); }
.bullet .gl { position: absolute; top: -4px; font-size: 11px; color: var(--fg3); transform: translateX(-50%); white-space: nowrap; }
.lockb { display: grid; place-items: center; width: 36px; height: 36px; border-radius: 50%; background: var(--t-ok); color: var(--ok); }

.map-card { display: flex; flex-direction: column; gap: 20px; }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--fg2); }
.legend span { display: inline-flex; align-items: center; gap: 6px; } .legend i { display: inline-block; flex: none; }
.bignum { font-size: 40px; line-height: 44px; font-weight: 600; letter-spacing: -.025em; }
.gs { display: grid; gap: 24px; align-items: start; } .gs > * { min-width: 0; } .gs-380 { grid-template-columns: minmax(0, 1fr) minmax(0, 380px); } .gs-440 { grid-template-columns: minmax(0, 1fr) minmax(0, 440px); } .gs-460 { grid-template-columns: minmax(0, 1fr) minmax(0, 460px); } .gs.stretch { align-items: stretch; }
.house-wrap { display: grid; grid-template-columns: minmax(0, 1fr) 150px; align-items: stretch; flex: 1; }
.inet { align-self: center; }
.house { position: relative; display: grid; grid-template-columns: 1fr 1fr; grid-auto-rows: minmax(144px, 1fr); gap: 8px; padding: 10px; border: 1px dashed var(--l2); border-radius: 20px; background: var(--bg); }
.links { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; overflow: visible; z-index: 1; }
.room { position: relative; display: flex; flex-direction: column; justify-content: space-between; gap: 18px; min-height: 144px; padding: 14px 16px; border-radius: 12px; background: var(--s2); border: 1px solid var(--l1); text-align: left; transition: border-color .15s, background .15s; }
.room:hover { border-color: var(--l3); background: var(--s3); }
.room.r-right { align-items: flex-end; text-align: right; }
.room.r-bottom { flex-direction: column-reverse; }
.room.span { grid-column: 1 / -1; align-items: center; text-align: center; }
.room.st-mute { border-color: var(--t-mute2); } .room.st-off { border: 1px dashed var(--t-warn2); }
.room .nm { font-weight: 500; font-size: 14px; } .room .sc { font-size: 12px; color: var(--fg2); }
.room.st-mute .sc { color: var(--mute); } .room.st-off .sc { color: var(--warn); }
.mk { position: relative; z-index: 2; display: grid; place-items: center; width: 44px; height: 44px; border-radius: 50%; background: var(--grafito); border: 1px solid var(--l2); box-shadow: 0 10px 24px -6px rgba(0,0,0,.6); margin-inline: 34px; }
.room.span .mk { margin-inline: 0; }
.mk i { display: grid; place-items: center; width: 20px; height: 20px; border-radius: 50%; background: var(--c); box-shadow: 0 0 14px var(--c); color: var(--ink); }
.mk i .ic { width: 12px; height: 12px; stroke-width: 2; }
.mk.k-off i { background: transparent; border: 1.5px solid var(--warn); box-shadow: none; color: var(--warn); }
.mk.k-mute i { color: var(--fg); }
.core-node { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); z-index: 3; display: flex; flex-direction: column; align-items: center; gap: 8px; pointer-events: none; }
.core-box { position: relative; width: 100px; height: 56px; border-radius: 12px; background: var(--grafito); border: 1px solid var(--l3); box-shadow: 0 12px 24px -4px rgba(0,0,0,.6); }
.core-box .sym { position: absolute; left: 43px; top: 12px; width: 14px; height: 14px; opacity: .8; }
.core-box .lb { position: absolute; left: 30px; top: 40px; width: 22px; height: 3px; border-radius: 2px; background: var(--cc, var(--ok)); box-shadow: 0 0 12px var(--cc, var(--ok)); }
.core-box .key { position: absolute; left: 64px; top: 38px; width: 12px; height: 7px; border-radius: 2px; border: 1px solid var(--l3); }
.core-glow { position: absolute; width: 260px; height: 160px; border-radius: 50%; background: radial-gradient(closest-side, rgba(52,224,122,.16), transparent); left: 50%; top: 50%; transform: translate(-50%, -50%); z-index: 0; pointer-events: none; }
.core-tag { padding: 3px 8px; border-radius: 999px; background: var(--s1); border: 1px solid var(--l2); font-size: 12px; color: var(--fg2); white-space: nowrap; order: -1; }
.inet { display: flex; flex-direction: column; align-items: center; gap: 6px; position: relative; text-align: center; padding-left: 26px; }
.inet::before { content: ""; position: absolute; left: 0; right: calc(50% + 26px); top: 64px; border-top: 1.5px dashed var(--fg3); opacity: .6; }
.inet .cloud { display: grid; place-items: center; width: 52px; height: 52px; border-radius: 50%; border: 1px dashed var(--l3); color: var(--fg3); }
.inet .zero { position: relative; margin-bottom: 4px; display: inline-flex; align-items: center; gap: 6px; padding: 5px 10px 5px 8px; border-radius: 999px; background: var(--s1); border: 1px solid var(--t-ok2); font: 13px var(--f-data); z-index: 4; }
.inet .zero .ic { color: var(--ok); }
.inet .cl { margin-top: 4px; }
.ncards { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 16px; }
.ncard { display: flex; flex-direction: column; gap: 14px; padding: 16px; text-align: left; background: var(--s1); border: 1px solid var(--l1); border-radius: 16px; box-shadow: inset 0 1px 0 rgba(255,255,255,.045); transition: border-color .15s, background .15s; }
.ncard:hover { border-color: var(--l3); background: var(--s2); }
.ncard .stage { height: 92px; }
.ncard .t { display: flex; align-items: center; gap: 8px; } .ncard .t b { flex: 1; font-size: 17px; font-weight: 600; letter-spacing: -.006em; }
.ncard .t .ic { color: var(--fg3); }
.ncard:hover .t .ic { color: var(--fg); }
.ncard .s { display: flex; align-items: center; gap: 8px; justify-content: space-between; }
.sec-h { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }

.modal-w { position: relative; margin: auto; width: min(600px, calc(100% - 32px)); max-height: calc(100% - 48px); overflow-y: auto; background: var(--s1); border: 1px solid var(--l2); border-radius: 24px; box-shadow: 0 24px 56px -8px rgba(0,0,0,.55), inset 0 1px 0 rgba(255,255,255,.06); padding: 28px 32px; display: flex; flex-direction: column; gap: 22px; animation: pop .22s cubic-bezier(.2,.7,.2,1); }

  .tabbar { display: grid; grid-template-columns: repeat(5, 1fr); position: fixed; left: 0; right: 0; bottom: 0; z-index: 40; padding: 6px max(8px, env(safe-area-inset-right, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(8px, env(safe-area-inset-left, 0px)); background: rgba(12,13,16,.94); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border-top: 1px solid var(--l2); }

function houseMap() {

    const rowI = Math.floor(i / 2), span = n % 2 === 1 && i === n - 1, right = !span && i % 2 === 1, bottom = rows > 1 && rowI > Math.max(0, Math.floor((rows - 2) / 2));
    const st = status(r), L = LIGHT[lightOf(r)];
    const kind = st === 'off' || st === 'boot' ? 'k-off' : st === 'mute' ? 'k-mute' : '';
    const inner = st === 'off' || st === 'boot' ? ic('wifioff') : st === 'mute' ? ic('micoff') : ic('mic');
    return `<button type="button" class="room${right ? ' r-right' : ''}${bottom ? ' r-bottom' : ''}${span ? ' span' : ''} st-${st}" data-act="openRoom" data-arg="${r.id}" aria-label="${esc(r.name)}: ${esc(capOf(r))}">
      <span><span class="nm" style="display:block">${esc(r.name)}</span><span class="sc">${esc(capOf(r))}</span></span>
      <span class="mk ${kind}" data-mk="${r.id}"><i style="--c:${L.mk}">${inner}</i></span></button>`;
  }).join('');
  const coreRoom = rs.find(r => r.core);
  return `<div class="house-wrap"><div class="house" id="house"><span class="core-glow" style="${S.core.online ? '' : 'opacity:0'}"></span><svg class="links" id="links" aria-hidden="true"></svg>${cells}
  <div class="core-node" id="coreNode"><span class="core-tag">DOMI CORE${coreRoom ? ' · ' + esc(coreRoom.name.toLowerCase()) : ''}</span><span class="core-box" style="--cc:${S.core.online ? 'var(--ok)' : 'var(--warn)'}"><svg class="sym" aria-hidden="true"><use href="#i-domi"></use></svg><span class="lb"></span><span class="key"></span></span></div></div>
  <div class="inet"><span class="zero" title="Audios enviados fuera de la empresa">${ic('candado', 's14')}0 audios</span><span class="cloud">${ic('nubeoff', 's24')}</span><span class="cl"><span class="small muted" style="display:block">Internet</span><span class="cap faint">no recibe tu voz</span></span></div></div>`;
}
function drawLinks() {
  const house = $('#house'), svg = $('#links'), core = $('#coreNode .core-box'); if (!house || !svg || !core) return;
  let hb = house.getBoundingClientRect(); const rowsN = Math.ceil(S.rooms.length / 2), node = $('#coreNode'), glow = house.querySelector('.core-glow');
  let top = '50%'; if (rowsN >= 2) { const cells = house.querySelectorAll('.room'), j = Math.max(0, Math.floor((rowsN - 2) / 2)), a = cells[j * 2], b = cells[(j + 1) * 2]; if (a && b) top = ((a.getBoundingClientRect().bottom + b.getBoundingClientRect().top) / 2 - hb.top) + 'px'; }
  node.style.top = top; if (glow) glow.style.top = top; hb = house.getBoundingClientRect(); const cb = core.getBoundingClientRect();
  const cx = cb.left + cb.width / 2 - hb.left, cy = cb.top + cb.height / 2 - hb.top;
  svg.setAttribute('viewBox', `0 0 ${hb.width} ${hb.height}`);
  let out = '';
  for (const r of S.rooms) {
    const mk = house.querySelector(`[data-mk="${r.id}"]`); if (!mk) continue;
    const b = mk.getBoundingClientRect(); const x = b.left + b.width / 2 - hb.left, y = b.top + b.height / 2 - hb.top;
    const st = status(r), l = lightOf(r); const d = `M ${x.toFixed(1)} ${y.toFixed(1)} L ${cx.toFixed(1)} ${cy.toFixed(1)}`;
    const dRev = `M ${cx.toFixed(1)} ${cy.toFixed(1)} L ${x.toFixed(1)} ${y.toFixed(1)}`;
    if (st === 'off' || st === 'boot') { out += `<path d="${d}" style="stroke:var(--warn)" stroke-width="1.5" stroke-dasharray="3 5" opacity=".8" fill="none"/>`; const mx = x + (cx - x) * 0.4, my = y + (cy - y) * 0.4; out += `<circle cx="${mx}" cy="${my}" r="9" style="fill:var(--s1)" stroke="rgba(245,184,61,.45)"/><path d="M ${mx - 3} ${my - 3} L ${mx + 3} ${my + 3} M ${mx + 3} ${my - 3} L ${mx - 3} ${my + 3}" style="stroke:var(--warn)" stroke-width="1.5" stroke-linecap="round"/>`; continue; }
    if (st === 'mute' || !S.core.online) { out += `<path d="${d}" style="stroke:var(--fg3)" stroke-width="1.5" opacity=".55" fill="none"${!S.core.online ? ' stroke-dasharray="3 5"' : ''}/>`; continue; }
    const col = LIGHT[l].mk; out += `<path d="${d}" style="stroke:${col}" stroke-width="1.5" opacity=".85" fill="none"/>`;
    if (l === 'reposo') out += `<circle cx="${x + (cx - x) * 0.42}" cy="${y + (cy - y) * 0.42}" r="3.5" style="fill:${col};filter:drop-shadow(0 0 5px ${col})"/>`;
    else if (!REDUCED) out += `<circle r="4" style="fill:${col};filter:drop-shadow(0 0 6px ${col})"><animateMotion dur="0.9s" repeatCount="indefinite" path="${l === 'escuchando' || l === 'pensando' ? d : dRev}"/></circle>`;
  }
  svg.innerHTML = out;
}

function summaryOf(d) {
  const when = [];
  if (d.schedule.on && d.schedule.days.length) when.push((d.schedule.days.length === 7 ? 'Todos los días' : cap(daysText(d.schedule.days))) + ' a las ' + d.schedule.time);

  const what = d.actions.length ? routineSentence(d) : 'todavía no hace nada';
  if (!when.length) return 'Elegí una frase o un horario. Después, DOMI ' + what + '.';
  return when.join(', ') + ', DOMI ' + what + '.';
}

const HOURS = [null, null, null, null, null, null, 2.3, 2.2, 2.0, 1.9, 2.1, 2.0, 2.2, 2.4, 2.1, 1.9, 2.0, 2.1, 2.2, 2.0, 2.3, 2.1, 1.9, 2.0];
function chartSVG() {
  const W = 640, H = 220, X0 = 40, Y0 = 190, TOP = 16, nowH = new Date().getHours();
  const y = v => Y0 - v * (Y0 - TOP) / 3.5, slot = (W - X0) / 24;
  const extraNow = S.stats.extra.filter(e => new Date(e.t).getHours() === nowH).map(e => e.s);
  let o = '';
  for (const v of [0, 1, 2, 3]) o += `<line x1="${X0}" x2="${W}" y1="${y(v)}" y2="${y(v)}" style="stroke:var(--l1)"/><text x="0" y="${y(v) + 4}">${v ? v + ' s' : '0'}</text>`;
  o += `<rect x="${X0}" y="${y(2.8)}" width="${W - X0}" height="${y(1.8) - y(2.8)}" style="fill:var(--t-ok)"/>`;
  o += `<line x1="${X0}" x2="${W}" y1="${y(3)}" y2="${y(3)}" style="stroke:var(--fg2)" stroke-dasharray="4 4" stroke-width="1.5"/><text x="${W - 4}" y="${y(3) - 6}" text-anchor="end">meta 3 s</text>`;
  for (let h = 0; h < 24; h++) {
    const cx = X0 + slot * h + slot / 2; let v = HOURS[h];
    if (h === nowH && extraNow.length) v = median((v ? [v, v, v] : []).concat(extraNow));
    if (h > nowH) o += `<rect x="${cx - 6}" y="${Y0 - 3}" width="12" height="3" rx="1.5" style="fill:var(--l2)"/>`;
    else if (v) o += `<rect x="${cx - 6}" y="${y(v)}" width="12" height="${Y0 - y(v)}" rx="3" style="fill:var(--ok)" opacity="${h === nowH ? 1 : .45}"><title>${String(h).padStart(2, '0')} h · ${v.toFixed(1).replace('.', ',')} s</title></rect>${h === nowH ? `<text class="now-l" x="${cx}" y="${y(v) - 8}" text-anchor="middle">${v.toFixed(1).replace('.', ',')} s · ahora</text>` : ''}`;
    if (h % 6 === 0 || h === 23) o += `<text x="${cx}" y="${Y0 + 20}" text-anchor="middle">${String(h).padStart(2, '0')}</text>`;
  }
  if (nowH >= 3) o += `<text x="${X0 + slot * 3}" y="${Y0 - 10}" text-anchor="middle">sin pedidos de noche</text>`;
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Mediana del tiempo de respuesta por hora, hoy. Ahora: ${medianToday().toFixed(1).replace('.', ',')} segundos. Meta: 3 segundos.">${o}</svg>`;
}

document.addEventListener('click', e => {

document.addEventListener('input', e => { const el = e.target; const b = el.dataset && el.dataset.bind; if (b && B[b] && el.tagName !== 'SELECT') B[b](el.value, el, e); });

});
document.addEventListener('keydown', e => {

setInterval(() => { UI.temp = Math.max(51, Math.min(57, UI.temp + Math.round(rnd(-1, 1)))); UI.fan = 30 + (UI.temp - 50) * 3; UI.watt = Math.max(4.2, Math.min(7.8, UI.watt + rnd(-0.4, 0.4))); const t = $('[data-temp]'), f = $('[data-fan]'), w = $('[data-watt]'); if (S.core.online && t) { t.textContent = UI.temp + ' °C'; f.textContent = UI.fan + ' % · silencioso'; w.textContent = UI.watt.toFixed(1).replace('.', ',') + ' W ahora · 4,1 W promedio'; } }, 3000);
})();
